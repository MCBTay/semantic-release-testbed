name: 🛠️ Build, Lint, and Test
description: An action for building, linting, and testing the library

inputs:
  publish-artifact:
    description: A boolean passed from the caller workflow to dictate if we should zip and upload the artifact
    default: false
    required: false
    type: boolean

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      shell: bash
      run: npm i
      working-directory: my-workspace

    - name: Build library
      shell: bash
      run: npm run build
      working-directory: my-workspace

    - name: Lint library
      shell: bash
      run: npm run lint
      working-directory: my-workspace

    - name: Zip artifact for deployment
      if: ${{ inputs.publish-artifact }}
      shell: bash
      run: zip -r dist.zip dist
      working-directory: my-workspace

    - name: Publish pipeline artifact
      if: ${{ inputs.publish-artifact }}
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: my-workspace/dist