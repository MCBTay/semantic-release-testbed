name: 📋 Check PR Title
description: Enforces a PR title format for pull requests to main or beta.
on: workflow_call

jobs:
  check-title:
    name: 📋 Check PR Title
    runs-on: ubuntu-latest
    
    steps:
      - name: 📋 Check PR title
        uses: actions/github-script@v7
        with:
          script: |
            // Angular commit types
            const types = [
              'feat', 
              'fix', 
              'docs', 
              'style', 
              'refactor', 
              'perf', 
              'test',
              'build', 
              'ci', 
              'chore', 
              'revert'
            ];

            // Regex: type, optional scope, colon, space, then subject
            const angularRegex = new RegExp(`^(${types.join('|')})(\([^)]+\))?: .+`);

            // Regex: [JIRA-1234] must be the first part of the subject after colon and space
            const jiraRegex = /: \[JIRA-\d+\] /;

            const prTitle = context.payload.pull_request.title;

            if (!angularRegex.test(prTitle)) {
              core.setFailed(`PR title must follow Angular convention: <type>(<optional scope>): <subject>\nAllowed types: ${types.join(', ')}`);
            } else {
              // Extract the subject (after the colon and space)
              const subject = prTitle.replace(/^(${types.join('|')})(\([^)]+\))?: /, '');
              if (!/^\[JIRA-\d+\]/.test(subject)) {
                core.warning(`PR title subject should start with a JIRA ticket, e.g. [JIRA-1234] <subject>`);
              }
            }
