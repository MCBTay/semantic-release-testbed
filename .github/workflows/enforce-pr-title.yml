name: 📋 Check PR Title
description: Enforces a PR title format for pull requests to main or beta.

on:
  pull_request:
    branches: [ "main", "beta" ]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Check PR title
        uses: actions/github-script@v7
        with:
          script: |
            // Angular commit types
            const types = [
              'feat', 
              'fix', 
              'docs', 
              'style', 
              'refactor', 
              'perf', 
              'test',
              'build', 
              'ci', 
              'chore', 
              'revert'
            ];

            // Regex: type, optional scope, colon, space, [JIRA-1234], space, then subject
            const angularJiraRegex = new RegExp(`^(${types.join('|')})(\\([^)]+\\))?: \\[JIRA-\\d+\\] .+`);
            const prTitle = context.payload.pull_request.title;
            
            if (!angularJiraRegex.test(prTitle)) {
              core.setFailed(
                `PR title must follow Angular convention and include a JIRA ticket: <type>(<optional scope>): [JIRA-1234] <subject>\nAllowed types: ${types.join(', ')}`
              );
            }
